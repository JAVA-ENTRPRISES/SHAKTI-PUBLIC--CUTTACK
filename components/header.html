<!-- ================= HEADER CSS ================= -->

<style>

  /* Desktop Navigation */
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;

    width: 0;
    height: 3px;

    background: #F9B900;

    border-radius: 10px;

    transition: width 0.3s ease;
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    width: 100%;
  }

  .nav-link.active {
    color: #062B78;
    font-weight: 700;
  }


  /* Mobile Navigation */
  .mobile-nav-link {
    display: flex;
    align-items: center;
    gap: 15px;

    padding: 13px 25px;

    color: #172033;

    font-weight: 600;

    border-left: 4px solid transparent;

    transition: all 0.25s ease;
  }

  .mobile-nav-link i {
    width: 20px;
    color: #062B78;
  }

  .mobile-nav-link:hover {
    background: #f8f8f8;
    color: #062B78;
    border-left-color: #F9B900;
    padding-left: 30px;
  }


  /* Active Mobile Link */
  .mobile-nav-link.active {
    background: #fff8df;
    color: #062B78;
    border-left-color: #F9B900;
  }

</style>


<!-- ================= MOBILE MENU SCRIPT ================= -->

<script>

  function openMenu() {

    document
      .getElementById("mobileMenu")
      .classList.remove("-translate-x-full");

    document
      .getElementById("overlay")
      .classList.remove("hidden");

    document.body.style.overflow = "hidden";
  }


  function closeMenu() {

    document
      .getElementById("mobileMenu")
      .classList.add("-translate-x-full");

    document
      .getElementById("overlay")
      .classList.add("hidden");

    document.body.style.overflow = "";
  }

</script>
